name: Extract ZIP and Build Lia AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check uploaded ZIP
        shell: bash
        run: |
          ZIP_FILE="lia-ai-complete-repaired.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found in the repository root."
            echo "Upload the project ZIP to the main page of the repository with this exact name."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q "lia-ai-complete-repaired.zip" -d extracted

          # Find the actual Gradle project root, even if the ZIP contains
          # one extra enclosing folder.
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found inside the ZIP."
            echo "The ZIP may contain the wrong files or an incomplete project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "No Gradle Wrapper found; using Gradle 8.9 installed by the workflow."
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lia-ai-debug-apks
          path: |
            extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7
