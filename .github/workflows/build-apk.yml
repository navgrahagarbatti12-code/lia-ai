name: Extract ZIP and Build Lia AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check uploaded ZIP
        shell: bash
        run: |
          ZIP_FILE="lia-ai-complete-repaired.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found in the repository root."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q "lia-ai-complete-repaired.zip" -d extracted

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle settings file found inside the ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Create temporary debug keystore if missing
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore is missing; generating a temporary debug keystore."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Existing debug.keystore found."
          fi

      - name: Set up compatible Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Direct and Play debug APKs
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDirectDebug assemblePlayDebug

      - name: Upload APK files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lia-ai-debug-apks
          path: |
            extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7
